name: CI and Pages

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - name: Verify checked-in JavaScript
        run: git diff --exit-code -- src/Blazor.AI.BrowserModels/wwwroot
      - run: dotnet build Blazor.AI.BrowserModels.slnx -c Release
      - run: dotnet test tests/Blazor.AI.BrowserModels.Tests -c Release --no-build --logger trx --results-directory artifacts/unit-results
      - name: Pack preview package
        run: dotnet pack src/Blazor.AI.BrowserModels -c Release --no-build -o artifacts/packages
      - name: Upload preview package
        uses: actions/upload-artifact@v4
        with:
          name: Blazor.AI.BrowserModels-preview
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          retention-days: 7
      - name: Read Pages configuration
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - run: dotnet publish src/Blazor.AI.BrowserModels.Wasm -c Release --no-restore -o artifacts/site
      - name: Prepare published app
        shell: pwsh
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          COMMIT: ${{ github.sha }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          $base = if ($env:IS_PR -eq 'true') { '/playwright/' } else { $env:PAGES_BASE }
          if ([string]::IsNullOrEmpty($base)) { $base = '/' }
          ./scripts/Prepare-Pages.ps1 -PublishedRoot artifacts/site/wwwroot -BasePath $base -Commit $env:COMMIT
      - name: Install Chromium
        run: pwsh tests/Blazor.AI.BrowserModels.Playwright.Tests/bin/Release/net11.0/playwright.ps1 install --with-deps chromium
      - name: Test published artifact
        env:
          PWTESTS_PublishedAppPath: artifacts/site/wwwroot
          PWTESTS_ExpectedCommit: ${{ github.sha }}
        run: dotnet test tests/Blazor.AI.BrowserModels.Playwright.Tests -c Release --no-build --filter 'Category!=RealModel' --logger trx --results-directory artifacts/browser-results
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            artifacts/*results/**
            artifacts/playwright-results/**
          retention-days: 7
      - name: Upload tested Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/site/wwwroot

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@v4

  deployed-tests:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build tests/Blazor.AI.BrowserModels.Playwright.Tests -c Release
      - run: pwsh tests/Blazor.AI.BrowserModels.Playwright.Tests/bin/Release/net11.0/playwright.ps1 install --with-deps chromium
      - name: Verify deployment and run browser tests
        env:
          PWTESTS_SampleBaseUrl: ${{ needs.deploy.outputs.page_url }}
          PWTESTS_ExpectedCommit: ${{ github.sha }}
        run: dotnet test tests/Blazor.AI.BrowserModels.Playwright.Tests -c Release --no-build --filter 'Category!=RealModel' --logger trx --results-directory artifacts/browser-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-test-results
          path: |
            artifacts/browser-results/**
            artifacts/playwright-results/**
          retention-days: 7
